<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PURE - أداة ضغط وتجهيز الفصول</title>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <style>
        :root {
            --hot-pink: #ff3d8b;
            --deep-pink: #c81466;
            --magenta: #9d0a52;
            --pale-pink: #ffe1ef;
            --ink: #4a0b2c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #fff8fb; color: var(--ink); padding: 20px; display: flex; justify-content: center; }

        .card { width: 100%; max-width: 420px; background: #fff; border: 3px solid var(--pale-pink); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: var(--hot-pink); margin-bottom: 15px; }

        .input-box { width: 100%; padding: 12px; border: 2px solid var(--pale-pink); border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 15px; }
        
        .upload-btn { border: 2px dashed var(--hot-pink); background: #fff0f6; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; margin-bottom: 15px; font-weight: bold; color: var(--magenta); }

        .btn-submit { width: 100%; background: var(--hot-pink); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-submit:disabled { background: #ccc; }

        /* شاشة التشخيص بالملي */
        .debug-box { margin-top: 20px; background: #111; color: #00ff66; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 0.75rem; max-height: 180px; overflow-y: auto; text-align: left; direction: ltr; }
        .err { color: #ff4444; }
    </style>
</head>
<body>

<div class="card">
    <h2>PURE ZIP GENERATOR</h2>

    <input type="text" id="zipName" class="input-box" placeholder="اسم الملف (مثال: Ch_01_PURE)">

    <div class="upload-btn" onclick="document.getElementById('fileInput').click()">
        📁 اضغط لاختيار الصور (من الملفات مباشرة)
        <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="loadFilesDirectly(this.files)">
    </div>

    <div id="stats" style="text-align:center; margin-bottom:15px; font-weight:bold;">الصور بالذاكرة: 0</div>

    <button class="btn-submit" id="mainBtn" onclick="buildZip()" disabled>توليد وحفظ ملف ZIP 💖</button>

    <div class="debug-box" id="debugConsole">
        <div>[SYSTEM READY] - بانتظار اختيار الصور...</div>
    </div>
</div>

<script>
    let ramStorage = [];

    function log(msg, isError = false) {
        const consoleBox = document.getElementById('debugConsole');
        const time = new Date().toLocaleTimeString();
        consoleBox.innerHTML += `<div class="${isError ? 'err' : ''}">[${time}] ${msg}</div>`;
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function loadFilesDirectly(files) {
        if (!files || files.length === 0) return;

        ramStorage = [];
        document.getElementById('debugConsole').innerHTML = '<div>[START LOADING]</div>';
        log(`تم اختيار ${files.length} ملف. جاري تحويلها للذاكرة...`);

        const fileArray = Array.from(files).filter(f => f.type.startsWith('image/'));
        fileArray.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

        for (let i = 0; i < fileArray.length; i++) {
            const f = fileArray[i];
            try {
                // القراءة المباشرة للبايتات لمنع حظر أندرويد
                const buffer = await f.arrayBuffer();
                if (buffer.byteLength === 0) throw new Error("الملف فارغ 0 بايت");

                ramStorage.push({
                    name: `${String(i + 1).padStart(3, '0')}.${f.name.split('.').pop() || 'jpg'}`,
                    bytes: new Uint8Array(buffer)
                });
                log(`✓ تم تحميل الصورة ${i + 1}: ${f.name} (${(buffer.byteLength / 1024).toFixed(1)} KB)`);
            } catch (error) {
                log(`✕ فشل قراءة الصورة ${i + 1} (${f.name}): ${error.message}`, true);
            }
        }

        document.getElementById('stats').innerText = `الصور الجاهزة بالذاكرة: ${ramStorage.length} من أصل ${fileArray.length}`;
        document.getElementById('mainBtn').disabled = ramStorage.length === 0;
        log(`[SUCCESS] اكتمل التحميل. الصور الجاهزة للضغط: ${ramStorage.length}`);
    }

    function buildZip() {
        if (ramStorage.length === 0) return;

        const zipName = document.getElementById('zipName').value.trim() || 'PURE_Chapter';
        const btn = document.getElementById('mainBtn');
        btn.disabled = true;

        log(`جاري ضغط ${ramStorage.length} ملف وإصدار الـ ZIP...`);

        const zipStructure = {};
        ramStorage.forEach(item => {
            zipStructure[item.name] = [item.bytes, { level: 0 }];
        });

        fflate.zip(zipStructure, { level: 0 }, (err, out) => {
            if (err) {
                log(`خطأ أثناء إنشاء ZIP: ${err.message}`, true);
                btn.disabled = false;
                return;
            }

            log(`تم التوليد بنجاح! جاري التنزيل...`);
            const blob = new Blob([out], { type: 'application/zip' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${zipName}.zip`;
            a.click();
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
