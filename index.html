<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>PURE - أداة ضغط وتجهيز الفصول</title>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
    <style>
        :root {
            --white: #ffffff;
            --grid-line: #f6cfe4;
            --hot-pink: #ff3d8b;
            --deep-pink: #c81466;
            --magenta: #9d0a52;
            --pale-pink: #ffe1ef;
            --ink: #4a0b2c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        html, body { min-height: 100vh; }

        body {
            background-color: #fff;
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 38px, var(--grid-line) 38px, var(--grid-line) 39px),
                repeating-linear-gradient(-45deg, transparent, transparent 38px, var(--grid-line) 39px);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        .shard { position: fixed; pointer-events: none; z-index: 0; opacity: 0.9; }
        .shard-1 { top: -60px; left: -40px; width: 260px; height: 260px; background: var(--hot-pink); clip-path: polygon(0 0, 70% 0, 100% 40%, 55% 100%, 0 70%); opacity: 0.85; }
        .shard-2 { top: 8%; right: -80px; width: 300px; height: 220px; background: var(--deep-pink); clip-path: polygon(100% 0, 100% 100%, 20% 100%, 0 30%, 60% 0); }
        .shard-3 { bottom: -70px; left: 6%; width: 220px; height: 220px; background: var(--pale-pink); clip-path: polygon(20% 0, 100% 10%, 80% 100%, 0 90%); }
        .shard-4 { bottom: -40px; right: 4%; width: 240px; height: 180px; background: var(--hot-pink); clip-path: polygon(0 20%, 60% 0, 100% 60%, 40% 100%, 0 80%); opacity: 0.5; }

        .mobile-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 26px;
            padding: 26px 24px;
            box-shadow: 0 24px 50px rgba(157, 10, 82, 0.18);
            border: 3px solid var(--pale-pink);
        }

        header { text-align: center; margin-bottom: 22px; }
        .logo { font-size: 3.2rem; font-weight: 900; letter-spacing: 2px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; gap: 2px; }
        .logo span { display: inline-block; -webkit-text-stroke: 2px var(--magenta); }
        .logo .l1 { color: var(--pale-pink); }
        .logo .l2 { color: var(--hot-pink); transform: translateY(-2px); }
        .logo .l3 { color: var(--deep-pink); transform: translateY(2px); }
        .logo .l4 { color: var(--hot-pink); }
        .logo-eye { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--ink) 0 5px, var(--hot-pink) 6px 12px, transparent 13px); border: 2px solid var(--magenta); display: inline-block; }
        .subtitle { font-size: 1.05rem; font-weight: 700; color: var(--deep-pink); margin-top: 4px; }

        .social-links { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
        .social-btn { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-decoration: none; color: white; }
        .tiktok { background: #000; } .discord { background: #5865F2; }

        .input-group { margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 14px 16px; border: 2px solid var(--pale-pink); border-radius: 14px; outline: none; font-size: 0.95rem; color: var(--ink); background: #fff; text-align: center; font-weight: 700; }

        .toggle-group { background: var(--pale-pink); padding: 12px 16px; border-radius: 16px; margin-bottom: 18px; border: 1px solid #ffc3e0; }
        .toggle-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: var(--magenta); }

        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #f3b8d3; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--hot-pink); }
        input:checked + .slider:before { transform: translateX(22px); }

        .drop-zone { border: 2.5px dashed var(--hot-pink); background: #fff8fb; border-radius: 18px; padding: 25px 15px; text-align: center; cursor: pointer; margin-bottom: 18px; }
        .drop-icon { font-size: 2.2rem; }
        .drop-text { font-size: 0.95rem; font-weight: 700; color: var(--magenta); margin-top: 4px; }
        .drop-subtext { font-size: 0.75rem; color: var(--deep-pink); opacity: 0.8; }

        .preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 160px; overflow-y: auto; margin-bottom: 18px; }
        .preview-item { position: relative; width: 100%; height: 75px; border-radius: 10px; overflow: hidden; border: 2px solid var(--pale-pink); }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-item .remove-btn { position: absolute; top: 2px; right: 2px; background: rgba(157, 10, 82, 0.85); color: white; border: none; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; cursor: pointer; }

        .stats-bar { background: var(--pale-pink); padding: 10px; border-radius: 12px; text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--magenta); margin-bottom: 16px; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, var(--hot-pink) 0%, var(--magenta) 100%); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:disabled { background: #d8c1cd; cursor: not-allowed; }

        .progress-bar { width: 100%; height: 10px; background: var(--pale-pink); border-radius: 5px; margin-top: 12px; overflow: hidden; display: none; }
        .progress-fill { height: 100%; width: 0%; background: var(--hot-pink); transition: width 0.1s; }
        
        .debug-console {
            margin-top: 15px;
            background: #1a020d;
            color: #ff85b3;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            text-align: left;
            direction: ltr;
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid var(--hot-pink);
            display: none;
            font-family: monospace;
        }
        .debug-title { font-weight: bold; color: #fff; margin-bottom: 5px; border-bottom: 1px solid #ff3d8b; padding-bottom: 3px; display: flex; justify-content: space-between; }
        .error-line { color: #ff4d4d; margin-bottom: 3px; }
        .success-line { color: #4dff88; margin-bottom: 3px; }
    </style>
</head>
<body>

<div class="shard shard-1"></div><div class="shard shard-2"></div>
<div class="shard shard-3"></div><div class="shard shard-4"></div>

<div class="mobile-card">
    <header>
        <div class="logo"><span class="l1">E</span><span class="l2">R</span><span class="logo-eye"></span><span class="l3">O</span><span class="l4">UP</span></div>
        <div class="subtitle">أداة تجميع وتجهيز الفصول</div>
        
        <div class="social-links">
            <a href="https://tiktok.com" target="_blank" class="social-btn tiktok"><span>🎵</span> TikTok</a>
            <a href="https://discord.gg" target="_blank" class="social-btn discord"><span>💬</span> Discord</a>
        </div>
    </header>

    <div class="input-group">
        <input type="text" id="zipName" placeholder="اسم ملف الـ ZIP (مثلاً: Ch_01_PURE)">
    </div>

    <div class="toggle-group">
        <div class="toggle-item">
            <span>تسمية تسلسلية (001, 002...)</span>
            <label class="switch">
                <input type="checkbox" id="renameFiles" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <div class="drop-icon">📂</div>
        <div class="drop-text">اضغط هنا لاختيار صور الفصل</div>
        <div class="drop-subtext">تتم المعالجة بالذاكرة فوراً وبدون أي تقطيع</div>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;" onchange="handleRAMFiles(this.files)">
    </div>

    <div class="preview-grid" id="previewGrid"></div>
    <div class="stats-bar" id="statsBar">عدد الصور: 0 | الحجم: ~0MB</div>

    <button class="btn-submit" id="submitBtn" onclick="generateZipFromRAM()" disabled>
        <span>توليد وتنزيل ملف ZIP</span>
        <span>💖</span>
    </button>

    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    
    <div class="debug-console" id="debugConsole">
        <div class="debug-title"><span>Live Error Debugger</span><span>[Active]</span></div>
        <div id="debugLogs"></div>
    </div>
</div>

<script>
    let ramStorage = [];

    function logDebug(message, isError = false) {
        const consoleBox = document.getElementById('debugConsole');
        const logsBox = document.getElementById('debugLogs');
        consoleBox.style.display = 'block';
        
        const time = new Date().toLocaleTimeString();
        const className = isError ? 'error-line' : 'success-line';
        logsBox.innerHTML += `<div class="${className}">[${time}] ${message}</div>`;
        consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function handleRAMFiles(files) {
        if (!files || files.length === 0) return;
        
        document.getElementById('debugLogs').innerHTML = '';
        ramStorage = [];
        let totalSize = 0;
        
        const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
        validFiles.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        logDebug(`بدء معالجة وفحص عدد (${validFiles.length}) ملف مدخل.`);

        const previewGrid = document.getElementById('previewGrid');
        previewGrid.innerHTML = '';

        for (let i = 0; i < validFiles.length; i++) {
            const file = validFiles[i];
            try {
                if (file.size === 0) throw new Error(`الملف فارغ (0 بايت).`);
                
                const buffer = await file.arrayBuffer();
                ramStorage.push({
                    name: file.name,
                    ext: file.name.split('.').pop() || 'jpg',
                    bytes: new Uint8Array(buffer),
                    blobUrl: URL.createObjectURL(file)
                });
                totalSize += buffer.byteLength;
                
                // عرض الصورة مصغرة للتصميم
                const item = document.createElement('div');
                item.className = 'preview-item';
                const img = document.createElement('img');
                img.src = ramStorage[i].blobUrl;
                item.appendChild(img);
                previewGrid.appendChild(item);

            } catch (err) {
                logDebug(`خطأ بالملف [${file.name}]: ${err.message}`, true);
            }
        }

        let sizeMB = totalSize / (1024 * 1024);
        document.getElementById('statsBar').innerText = `جاهز بالذاكرة: ${ramStorage.length} صورة | الحجم: ~${sizeMB.toFixed(1)}MB`;
        document.getElementById('submitBtn').disabled = ramStorage.length === 0;
        
        logDebug(`اكتمل التحميل في الذاكرة بنجاح. الصور الجاهزة: ${ramStorage.length}`);
    }

    function generateZipFromRAM() {
        if (ramStorage.length === 0) return;

        const zipName = document.getElementById('zipName').value.trim() || 'Ch_01_PURE';
        const shouldRename = document.getElementById('renameFiles').checked;
        const btn = document.getElementById('submitBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        btn.disabled = true;
        progressBar.style.display = 'block';
        progressFill.style.width = '30%';
        logDebug(`بذء عملية ضغط ملف: ${zipName}.zip`);

        const chunks = {};
        ramStorage.forEach((item, i) => {
            let fileName = shouldRename ? `${String(i + 1).padStart(3, '0')}.${item.ext}` : item.name;
            chunks[fileName] = [item.bytes, { level: 0 }];
        });

        progressFill.style.width = '70%';
        logDebug(`تم تجهيز الملفات بالذاكرة، جاري الدمج بـ fflate...`);

        fflate.zip(chunks, { level: 0 }, (err, out) => {
            if (err) {
                logDebug(`فشل الضغط: ${err.message}`, true);
                btn.disabled = false;
                progressBar.style.display = 'none';
                return;
            }

            progressFill.style.width = '100%';
            logDebug(`تم إنشاء الأرشيف بنجاح! جاري التنزيل...`);

            const blob = new Blob([out], { type: 'application/zip' });
            const downloadUrl = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = `${zipName}.zip`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            setTimeout(() => {
                URL.revokeObjectURL(downloadUrl);
                btn.disabled = false;
                progressBar.style.display = 'none';
                logDebug(`اكتمل التنزيل بنجاح تام 💖`);
            }, 1000);
        });
    }
</script>

</body>
</html>
